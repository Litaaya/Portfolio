baseURL: "https://Litaaya.github.io/Portfolio/"
languageCode: "vi-vn"
theme: "PaperMod"
canonifyURLs: false

defaultContentLanguage: vi
defaultContentLanguageInSubdir: true

params:
  ShowScrollToTop: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  vi:
    languageName: "Tiếng Việt"
    weight: 1
    title: "Litaaya"

    menu:
      main:
        - name: "Blogs"
          url: "posts/"
          weight: 10

        - name: "Tags"
          url: "tags/"
          weight: 20

        - name: "Tìm kiếm"
          url: "search/"
          weight: 30

    params:
      homeInfoParams:
        Title: "Chào cậu,"
        Content: >
          Thật tuyệt khi có thể gặp cậu ở đây.

      socialIcons:
        - name: "github"
          url: "https://github.com/Litaaya"

      fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 100
        threshold: 0.3
        minMatchCharLength: 2
        keys:
          - title

  en:
    languageName: "English"
    weight: 2
    title: "Litaaya"

    menu:
      main:
        - name: "Blogs"
          url: "posts/"
          weight: 10

        - name: "Tags"
          url: "tags/"
          weight: 20

        - name: "Search"
          url: "search/"
          weight: 30

    params:
      homeInfoParams:
        Title: "Hi friend,"
        Content: >
          It's great to see you here.

      socialIcons:
        - name: "github"
          url: "https://github.com/Litaaya"

      fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 100
        threshold: 0.3
        minMatchCharLength: 2
        keys:
          - title