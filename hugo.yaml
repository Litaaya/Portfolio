baseURL: "https://Litaaya.github.io/Portfolio/"
languageCode: "vi-vn"
theme: "PaperMod"
canonifyURLs: false

defaultContentLanguage: vi
defaultContentLanguageInSubdir: true

params:
  ShowScrollToTop: true
  ShowToc: true
  disableThemeToggle: true
  defaultTheme: light

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    style: github
    lineNos: false
    noClasses: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  vi:
    languageName: "Tiếng Việt"
    weight: 1
    title: "Litaaya"

    menu:
      main:
        - name: "Projects"
          url: "../en/projects/"
          weight: 10

        - name: "Blogs"
          url: "posts/"
          weight: 20

        - name: "Papers"
          url: "papers/"
          weight: 30


  en:
    languageName: "English"
    weight: 2
    title: "Litaaya"

    menu:
      main:
        - name: "Projects"
          url: "projects/"
          weight: 10

        - name: "Blogs"
          url: "posts/"
          weight: 20

        - name: "Papers"
          url: "papers/"
          weight: 30